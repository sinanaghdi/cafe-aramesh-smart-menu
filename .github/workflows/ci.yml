name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, typing, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest

  frontend:
    name: Frontend lint, typecheck, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run format:check

  smoke:
    name: Compose startup, migration, and seed smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for the API and verify the seeded data
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8000/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl --fail --silent http://localhost:8000/health | grep -q '"status":"ok"'
          curl --fail --silent http://localhost:8080/ | grep -q 'کافه آرامش'
          docker compose exec -T api python - <<'PY'
          from sqlalchemy import func, select
          from app.db.session import SessionLocal
          from app.models import CafeTable, Product, ProductTag

          with SessionLocal() as session:
              products = session.scalar(select(func.count()).select_from(Product))
              tags = session.scalar(select(func.count()).select_from(ProductTag))
              tables = session.scalar(select(func.count()).select_from(CafeTable))

          assert products == 25, f"Expected 25 demo products, got {products}"
          assert tags >= 25, f"Expected structured product tags, got {tags}"
          assert tables == 8, f"Expected 8 demo tables, got {tables}"
          print(f"Seed verified: {products} products, {tags} tags, {tables} tables.")
          PY
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  docker-build:
    name: Docker Compose build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
