name: Backend quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./backend/ci_test.db
      CAFE_TIMEZONE: Asia/Tehran
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend migrations tests
      - name: Check frontend JavaScript
        run: node --check app.js
      - name: Run integration tests
        run: pytest -q
      - name: Validate a fresh migration
        env:
          DATABASE_URL: sqlite:///./backend/ci_migration.db
        run: alembic upgrade head
