services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aramesh}
      POSTGRES_USER: ${POSTGRES_USER:-aramesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aramesh-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aramesh} -d ${POSTGRES_DB:-aramesh}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: "Café Aramesh Smart Menu API"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aramesh:aramesh-local-only@db:5432/aramesh}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-before-production}
      ORDER_CODE_HMAC_SECRET: ${ORDER_CODE_HMAC_SECRET:-dev-order-code-secret-change-before-production}
      ORDER_CODE_DIGITS: ${ORDER_CODE_DIGITS:-4}
      ORDER_CODE_TTL_MINUTES: ${ORDER_CODE_TTL_MINUTES:-15}
      ORDER_CODE_MAX_ATTEMPTS: ${ORDER_CODE_MAX_ATTEMPTS:-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_STAFF_EMAIL: ${DEMO_STAFF_EMAIL:-staff@aramesh.local}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-StaffDemo!2026}
      DEMO_MERCHANT_EMAIL: ${DEMO_MERCHANT_EMAIL:-merchant@aramesh.local}
      DEMO_MERCHANT_PASSWORD: ${DEMO_MERCHANT_PASSWORD:-MerchantDemo!2026}
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
